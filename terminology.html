<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminology Lessons · Sound Lexicon</title>
<meta name="description" content="What musical terms actually mean, and whether a generative music model hears them.">
<style>
  :root{
    --ink:#111419; --panel:#181c24; --panel2:#1f2530; --line:#2a313d;
    --text:#e9e6dd; --muted:#98a0ad; --dim:#6b7280;
    --amber:#e0a63c; --amber-dim:#8a6a2a;
    --teal:#1a9e75; --rose:#d03b3b; --violet:#6a5acd; --blue:#3273c4;
    /* Difficulty to HEAR, ramped green to red. One ramp, used everywhere the level
       appears — card edge, card chip, rail button — so the colour means the same thing
       in all three places and a reader only has to learn it once. */
    --d1:#3fae7f; --d2:#d9a536; --d3:#d9752f; --d4:#cf4b4b;
    --mono:'SF Mono','Menlo','Consolas','Liberation Mono',monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);line-height:1.5}
  a{color:var(--amber)}
  /* ---------- site nav (shared across pages; keep the three copies identical) ----------
     A slim constant strip so no page is a dead end: the wordmark goes home, the two tabs
     are the whole site. It sticks above the page's own sticky controls bar, which is why
     .controls parks at --navh rather than 0. */
  :root{ --navh:38px }
  html{scroll-padding-top:var(--navh)}
  .sitenav{position:sticky;top:0;z-index:30;background:var(--ink);border-bottom:1px solid var(--line)}
  .sitenav-in{max-width:1040px;margin:0 auto;padding:0 20px;display:flex;align-items:center;height:var(--navh);gap:2px}
  .sitenav .brand{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-right:16px;white-space:nowrap}
  .sitenav .brand::before{content:'←';margin-right:8px;color:var(--dim)}
  .sitenav .brand:hover{color:var(--amber)}
  .sitenav .brand:hover::before{color:var(--amber)}
  .navtab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);text-decoration:none;padding:0 12px;line-height:calc(var(--navh) - 2px);border-bottom:2px solid transparent;white-space:nowrap}
  .navtab:hover{color:var(--text)}
  .navtab[aria-current="page"]{color:var(--amber);border-bottom-color:var(--amber)}
  @media(max-width:520px){
    .sitenav-in{padding:0 14px}
    .sitenav .brand{margin-right:8px;letter-spacing:.12em}
    .sitenav .brand span{display:none}
    .navtab{padding:0 8px;letter-spacing:.06em}
  }
  .wrap{max-width:1040px;margin:0 auto;padding:28px 20px 90px}
  /* masthead */
  header.masthead{border-bottom:1px solid var(--line);padding-bottom:18px;margin-bottom:20px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
  .eyebrow a{color:var(--amber);text-decoration:none;border-bottom:1px dotted var(--amber-dim)}
  .eyebrow a:hover{border-bottom-style:solid}
  h1{font-size:30px;letter-spacing:-.01em;margin:0 0 6px;font-weight:700}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .sub b{color:var(--text);font-weight:600}
  /* the standing caveat — this page is about uncertainty, so it says so up top */
  .caveat{margin:18px 0 0;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--amber);border-radius:9px;padding:13px 16px;font-size:13.5px;color:var(--muted)}
  .caveat b{color:var(--text)}
  /* controls */
  .controls{position:sticky;top:var(--navh);background:var(--ink);padding:12px 0 10px;z-index:20;border-bottom:1px solid var(--line);margin-bottom:6px}
  .crow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  #q{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:13px;padding:9px 12px}
  #q::placeholder{color:var(--dim)}
  #q:focus{outline:none;border-color:var(--amber)}
  .pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 12px;cursor:pointer}
  .pill:hover{border-color:var(--amber);color:var(--text)}
  .pill.on{background:var(--amber);color:#1a1206;border-color:var(--amber);font-weight:600}
  .pill[disabled]{opacity:.4;cursor:default}
  .pill[disabled]:hover{border-color:var(--line);color:var(--muted)}
  /* The two difficulty shortcuts keep the ramp instead of going amber, so a lit pill says
     WHICH end of the scale is showing rather than just "a filter is on". */
  .pill.diff::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
    background:currentColor;margin-right:6px;vertical-align:baseline;opacity:.85}
  .pill.diff.easy{color:var(--d1)} .pill.diff.hard{color:var(--d4)}
  .pill.diff:hover{border-color:currentColor}
  .pill.diff.on{background:var(--panel2);border-color:currentColor;font-weight:600}
  .hits{font-family:var(--mono);font-size:11px;color:var(--dim)}
  /* domain rail */
  .rail{margin-top:10px}
  .railgroup{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
  .raillab{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin-right:2px;flex:none;width:64px}
  .dm{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:5px 10px;cursor:pointer}
  .dm:hover{border-color:var(--amber);color:var(--text)}
  .dm.on{background:var(--panel2);color:var(--text);border-color:var(--amber)}
  .dm i{font-style:normal;color:var(--dim);margin-left:5px;font-size:10px}
  .dm.on i{color:var(--amber)}
  /* Difficulty buttons carry their own colour even when off, so the rail doubles as the
     key for the card edges — there is no separate legend to keep in sync. */
  .dm.diff{border-left-width:3px}
  .dm.diff.d1{border-left-color:var(--d1)} .dm.diff.d2{border-left-color:var(--d2)}
  .dm.diff.d3{border-left-color:var(--d3)} .dm.diff.d4{border-left-color:var(--d4)}
  .dm.diff.on{border-color:currentColor;background:var(--panel2)}
  .dm.diff.on i{color:inherit}
  .dblurb{font-size:13px;color:var(--muted);margin:10px 0 0;min-height:0}
  /* cards */
  .card{position:relative;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--amber-dim);border-radius:10px;padding:18px 20px;margin:14px 0}
  /* The left edge is the only card-level colour, so it carries the one thing worth
     scanning a hundred cards for: what it will cost you to hear this. */
  .card.d1{border-left-color:var(--d1)} .card.d2{border-left-color:var(--d2)}
  .card.d3{border-left-color:var(--d3)} .card.d4{border-left-color:var(--d4)}
  .card:target,.card.flash{animation:flashcard 1.4s ease-out}
  @keyframes flashcard{0%{box-shadow:0 0 0 2px var(--amber)}100%{box-shadow:0 0 0 2px transparent}}
  .ctop{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding-right:64px}
  .term{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .anchor{font-family:var(--mono);font-size:11px;color:var(--dim);text-decoration:none}
  .anchor:hover{color:var(--amber)}
  .likewrap{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:3px}
  .like{background:transparent;border:none;cursor:pointer;font-size:17px;line-height:1;color:var(--dim);padding:2px 4px;transition:transform .1s,color .12s}
  .like:hover,.like.on{color:var(--rose)}
  .like:active{transform:scale(1.3)}
  .lcount{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:9px;text-align:right}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 0}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:2px 8px;color:var(--muted)}
  .chip.dom{border-color:var(--amber-dim);color:var(--amber)}
  .chip.kind b{color:var(--text);font-weight:600}
  .chip.era{border-color:var(--blue);color:#8fb6e8;cursor:pointer}
  .chip.era:hover{background:rgba(50,115,196,.16);color:#bcd6f5}
  /* Difficulty rides on the card's own colour so it reads at a glance in a long list. */
  .chip.diff{cursor:pointer;font-weight:600;border-color:currentColor}
  .chip.diff:hover{background:rgba(255,255,255,.05)}
  .chip.diff .n{opacity:.62;font-weight:400;margin-right:5px}
  .d1 .chip.diff,.dm.diff.d1.on{color:var(--d1)}
  .d2 .chip.diff,.dm.diff.d2.on{color:var(--d2)}
  .d3 .chip.diff,.dm.diff.d3.on{color:var(--d3)}
  .d4 .chip.diff,.dm.diff.d4.on{color:var(--d4)}
  /* "What you hear" leads the card — the lay reader recognises sound, not mechanism */
  .hear{margin:14px 0 0;border-left:2px solid var(--amber);padding:2px 0 2px 14px}
  .hear .lab{color:var(--amber);margin-bottom:5px}
  .hear p{font-size:16px;line-height:1.62;margin:0;color:var(--text)}
  .blk{margin-top:14px}
  .lab{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .body{font-size:14px;color:var(--text);line-height:1.6}
  .body.mut{color:var(--muted)}
  .syn{display:flex;gap:6px;flex-wrap:wrap}
  .syn span{font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--muted)}
  .myth{background:rgba(208,59,59,.07);border:1px solid rgba(208,59,59,.28);border-radius:8px;padding:11px 13px}
  .myth .lab{color:var(--rose)}
  .twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:680px){.twocol{grid-template-columns:1fr}}
  /* resolution — the field the page exists for */
  .res{margin-top:16px;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .reshead{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--panel2);padding:9px 13px;border-bottom:1px solid var(--line)}
  .reshead .lab{margin:0}
  .verdict{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:5px;padding:3px 9px;font-weight:600}
  .v-untested{background:rgba(224,166,60,.14);color:var(--amber);border:1px solid var(--amber-dim)}
  .v-resolves{background:rgba(26,158,117,.14);color:var(--teal);border:1px solid var(--teal)}
  .v-partial{background:rgba(106,90,205,.16);color:#9d92e6;border:1px solid var(--violet)}
  .v-collapses{background:rgba(208,59,59,.13);color:var(--rose);border:1px solid var(--rose)}
  .stamp{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-left:auto}
  .res .body{padding:12px 13px}
  /* ---------- collapsed by default ----------
     Ninety-nine lessons at full height is a page you scroll past rather than read. A card
     opens on request; what stays visible is the bar that lets you decide whether to open it:
     the term, what it actually is, where it belongs, and whether anybody has vouched for its
     demos yet. Purely a CSS state — the whole card is still in the DOM, so votes, hearts and
     the player patch a collapsed card exactly as they patch an open one. Hiding it also
     spares the demo artwork: a lazy image inside display:none is never fetched. */
  .chead{cursor:pointer;border-radius:9px;margin:-5px -7px 0;padding:5px 7px;transition:background .12s}
  .chead:hover{background:rgba(255,255,255,.022)}
  .chead:focus-visible{outline:1px solid var(--amber);outline-offset:1px}
  .caret2{color:var(--muted);font-size:12px;transition:transform .15s,color .15s;display:inline-block;width:12px}
  .chead:hover .caret2{color:var(--amber)}
  .card.open .caret2{transform:rotate(90deg);color:var(--amber)}
  .card:not(.open) .cbody{display:none}
  /* Era and nature are for reading, not for choosing — the closed bar keeps domain, kind and
     difficulty, which are the three you would sort a hundred cards by. */
  .card:not(.open) .chip.era,.card:not(.open) .chip.nat{display:none}
  .csum{margin:9px 0 0;font-size:14px;line-height:1.5;color:var(--muted);
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.open .csum{display:none}
  .cmeta{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;margin-left:auto}
  .cmeta b{color:var(--teal);font-weight:600}
  .card.open .cmeta{display:none}
  /* evidence */
  .ev{margin-top:16px}
  .evstate{font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(224,166,60,.08);border:1px solid var(--amber-dim);border-radius:7px;padding:8px 11px;margin-bottom:10px}
  .evstate.some{color:var(--teal);background:rgba(26,158,117,.08);border-color:var(--teal)}
  .evitem{border-top:1px solid var(--line);padding:11px 0 3px}
  .evitem:first-of-type{border-top:none}
  .evhead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .evn{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .evname{font-size:13.5px;font-weight:600}
  .evspan{font-family:var(--mono);font-size:11px;background:rgba(224,166,60,.13);border:1px solid var(--amber-dim);color:var(--amber);border-radius:4px;padding:1px 6px}
  .evstateT{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
  .evstateT.rejected{color:var(--rose);border-color:var(--rose)}
  .evstateT.found{color:var(--teal);border-color:var(--teal)}
  /* a track a listener attached themselves — teal, the colour a vote already wears here */
  .evstateT.addedt{color:var(--teal);border-color:var(--teal)}
  .addev{margin-top:15px;border-top:1px dashed var(--line);padding-top:12px}
  .addform{display:none;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .addform.open{display:flex}
  .addin{flex:1 1 280px;min-width:0;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--text);font-family:var(--mono);font-size:11.5px;padding:7px 10px}
  .addin:focus{outline:none;border-color:var(--teal)}
  .addin::placeholder{color:var(--dim)}
  .addmsg{flex-basis:100%;font-family:var(--mono);font-size:11px;color:var(--teal);margin:0}
  .addmsg.bad{color:var(--rose)}
  .addnote{flex-basis:100%;font-family:var(--mono);font-size:10.5px;color:var(--dim);margin:0}
  /* support votes — "does this track actually demonstrate the term?", one click, shared */
  .evitem.st-rejected{opacity:.5}
  .vote{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:4px 10px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .vote:hover{border-color:var(--teal);color:var(--teal)}
  .vote .arrow{font-size:11px;line-height:1}
  .vote .vc{font-size:11.5px;letter-spacing:0;color:var(--dim)}
  .vote.on{background:rgba(26,158,117,.15);border-color:var(--teal);color:var(--teal)}
  .vote.on .vc{color:var(--teal);font-weight:600}
  .vote.has{border-color:var(--amber-dim)}
  .vote.has .vc{color:var(--amber)}
  .evitem.supported{box-shadow:inset 2px 0 0 var(--teal);padding-left:11px}
  /* learned: private per-browser progress, never shared */
  .card.learned{border-left-color:var(--teal)}
  .learn{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:20px;padding:3px 11px;cursor:pointer;transition:border-color .12s,color .12s,background .12s}
  .learn:hover{border-color:var(--teal);color:var(--teal)}
  .learn.on{background:rgba(26,158,117,.15);border-color:var(--teal);color:var(--teal);font-weight:600}
  .progress{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .progress b{color:var(--teal)}
  /* "more examples" — the rest of the corpus using this wording, uncurated */
  .more{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
  .morebtn{width:100%;text-align:left;display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:9px 13px;cursor:pointer}
  .morebtn:hover{border-color:var(--amber);color:var(--text)}
  .morebtn .caret{color:var(--amber);transition:transform .15s;display:inline-block;font-size:10px}
  .morebtn.open .caret{transform:rotate(180deg)}
  .moremeta{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px;color:var(--dim)}
  .morelist{display:none;margin-top:6px}
  .morelist.open{display:block}
  /* no base left padding, so an unmarked row starts at exactly the same x as a curated
     one; the inset bar adds its own indent only when there is a bar to clear */
  .mitem{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .mitem:first-child{border-top:none}
  .mitem.supported{box-shadow:inset 2px 0 0 var(--teal);padding-left:11px}
  .mname{font-size:13px;font-weight:600}
  /* controls hold a fixed left column; the metadata takes what is left and truncates */
  .mctl{flex:none;display:flex;align-items:center;gap:8px}
  .mmeta{flex:1;min-width:0;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
  .mmeta .mname{overflow:hidden;text-overflow:ellipsis}
  .mmeta .evspan,.mmeta .evstateT{flex:none}
  @media(max-width:640px){.mitem{flex-wrap:wrap}.mmeta{flex-basis:100%}}
  .morefoot{margin-top:10px;display:flex;gap:8px;align-items:center}
  .morenote{font-size:12px;color:var(--dim)}
  .evwhy{font-size:13px;color:var(--muted);margin:5px 0 8px}
  .evrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:5px;padding:4px 10px;cursor:pointer}
  .btn:hover{border-color:var(--amber);color:var(--amber)}
  .btn.done{border-color:var(--teal);color:var(--teal)}
  /* demo tiles (artwork is the play button; audio itself is hotlink-protected) */
  .tiles{display:flex;gap:7px;flex-wrap:wrap}
  .tile{position:relative;width:44px;height:44px;border-radius:7px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);padding:0;cursor:pointer;flex:none}
  .tile img{width:100%;height:100%;object-fit:cover;display:block}
  .tile .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.32);color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
  .tile:hover{border-color:var(--amber)}
  /* the demo currently loaded in the side player */
  .tile.playing{border-color:var(--amber);box-shadow:0 0 0 2px var(--amber),0 0 12px rgba(224,166,60,.35)}
  .tile.playing .play{background:rgba(224,166,60,.30)}
  .tile.playing .play::after{content:'';position:absolute;inset:0;border-radius:6px;animation:pulseplay 1.8s ease-in-out infinite}
  @keyframes pulseplay{0%,100%{box-shadow:inset 0 0 0 0 rgba(224,166,60,0)}50%{box-shadow:inset 0 0 0 2px rgba(224,166,60,.55)}}
  .tile:hover .play{background:rgba(0,0,0,.10)}
  .nodemo{font-family:var(--mono);font-size:11px;color:var(--dim)}
  /* the exemplar record — the only place on the page a real name may appear */
  .exemplar{margin-top:16px;border:1px solid var(--line);border-left:2px solid var(--C);border-radius:9px;padding:11px 14px;background:rgba(26,158,117,.05)}
  .exemplar .lab{color:var(--C);margin-bottom:5px}
  .exrec{margin:0 0 5px;font-size:15px;color:var(--text)}
  .exrec b{font-weight:700}
  .exlink{color:var(--text);text-decoration:none;border-bottom:1px solid transparent}
  .exlink:hover{color:var(--C);border-bottom-color:var(--C)}
  .exlink .ext{font-size:11px;color:var(--C);margin-left:2px}
  .exlisten{margin:0;font-size:13.5px;color:var(--muted);line-height:1.55}
  /* momentary-event hint (no seek mechanism exists — see design doc §5) */
  .moment{margin-top:12px;font-size:12.5px;color:var(--muted);border-left:2px solid var(--violet);padding:2px 0 2px 11px}
  /* prompt pop-out */
  #ov{position:fixed;inset:0;background:rgba(8,10,14,.72);backdrop-filter:blur(2px);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
  #ov.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:760px;width:100%;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .mhead{position:sticky;top:0;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;z-index:2}
  .mhead h3{margin:0;font-size:15px}
  .mclose{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:14px;line-height:1}
  .mclose:hover{border-color:var(--amber);color:var(--amber)}
  .mbody{padding:16px 18px 20px}
  .mnote{font-size:13px;color:var(--muted);margin:0 0 14px}
  .plab{display:flex;justify-content:space-between;align-items:center;margin:14px 0 5px}
  .plab span{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  pre{margin:0;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:12px 13px;font-family:var(--mono);font-size:12px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word}
  pre.neg{color:var(--muted)}
  mark{position:relative;background:rgba(224,166,60,.26);color:var(--amber);border-radius:3px;padding:0 2px;font-weight:600;box-shadow:0 0 0 1px var(--amber-dim);cursor:pointer;transition:background .12s}
  mark:hover,mark:focus-visible{background:rgba(224,166,60,.46);outline:none;box-shadow:0 0 0 1px var(--amber)}
  /* the affordance is a ::after badge, so copying never rewrites the quoted prompt text */
  /* Sits tight in the gap above the phrase. It still overlaps the line above by a hair —
     any floating affordance must — so it is kept small and fully opaque rather than
     hovering high where it would blot out a whole word of the prompt. */
  mark::after{content:'Copy';position:absolute;left:50%;bottom:calc(100% + 1px);transform:translateX(-50%);
    font-family:var(--mono);font-size:8.5px;line-height:1.35;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
    background:var(--panel2);border:1px solid var(--amber-dim);color:var(--amber);border-radius:3px;
    padding:0 5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .12s;z-index:4}
  mark:hover::after,mark:focus-visible::after{opacity:1}
  mark.copied{background:rgba(26,158,117,.28);color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
  mark.copied::after{content:'Copied';opacity:1;border-color:var(--teal);color:var(--teal)}
  /* side player */
  #player{position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:70;display:flex;align-items:center}
  #player .pbody{width:320px;max-width:80vw;background:var(--panel);border:1px solid var(--line);border-left:none;border-radius:0 12px 12px 0;box-shadow:0 12px 44px rgba(0,0,0,.55);padding:11px;transition:width .25s,padding .25s,opacity .2s;overflow:hidden}
  #player.collapsed .pbody{width:0;padding:0;border-width:0;opacity:0;pointer-events:none}
  #player .ptab{background:var(--panel);border:1px solid var(--line);border-left:none;border-radius:0 8px 8px 0;color:var(--amber);cursor:pointer;padding:14px 5px;font-size:13px}
  #player .phead{display:flex;align-items:center;gap:8px;margin:0 0 7px}
  #player .ptitle{font-size:12px;color:var(--muted);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .plikewrap{position:static;flex:none;display:flex;align-items:center;gap:3px}
  .plikewrap[hidden]{display:none}
  #player iframe{width:100%;height:120px;border:0;border-radius:8px;display:block;background:var(--panel2)}
  footer{margin-top:44px;border-top:1px solid var(--line);padding-top:16px;font-size:12.5px;color:var(--dim)}
</style>

<div id="player" class="collapsed">

    <div class="phead">

      <span class="likewrap plikewrap" id="plikewrap" hidden>
        <button class="like" id="plike" data-like="" aria-label="Like this lesson">&#9829;</button>
        <span class="lcount" id="plikecount" data-lc=""></span>
      </span>

  </div>
