</div>

<script src="data.js"></script>
<script src="lexicon_data.js"></script>
<script>
/* ============================================================================
   Terminology Lessons — render.
   A card is a TERM. The prompt is evidence and lives in the pop-out, never on the
   card face (design doc §6). Evidence is not stored here: it points at entries in
   LIB by number, so the prompt shown is always the real one, never a stale copy.
   ========================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* The eight mandated negatives are appended at generation time, not stored in the
   entry — so the negative shown here must append them too, or the evidence would
   not match what actually produced the demo. */
const MANDATED = 'Harmonic stagnation, Dynamic flattening, Quantized sterility, Structural monotony, Predictability, Vocal identity drift, Vocalist substitution, Soundtubes';

/* Link to a title-and-artist SEARCH rather than a hardcoded video id, unless a card
   supplies one. Two reasons, and the second is the important one: a specific id would have
   to be invented, and an invented eleven-character id does not fail cleanly — it resolves
   to some unrelated video. A search always lands on the right record and never rots when a
   video is taken down, made private or region-locked. `exemplar.video` overrides it when a
   real id is known and worth pinning. */
function ytLink(x) {
  if (x.video) return `https://www.youtube.com/watch?v=${encodeURIComponent(x.video)}`;
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(x.title + ' ' + x.artist)}`;
}

const byN = new Map(LIB.map(v => [String(v.n ?? v.id), v]));
const domById = new Map(DOMAINS.map(d => [d.id, d]));

/* A demo the corpus already knows, addressed the way a listener addresses it: by the id in
   its Suno link. Lets a pasted track resolve back to the entry that made it — prompt and
   all — instead of arriving as an anonymous id. */
const bySuno = new Map();
LIB.forEach(v => (v.suno || []).forEach(id => bySuno.set(String(id), v)));

/* Everything a listener pastes is squeezed through this. It accepts a whole Suno link, an
   embed link, or a bare id, and yields ONLY the 36 characters of hex and dashes — which is
   also the security story: the value reaches an <img> src, an iframe src and a database key,
   and a whitelist this narrow cannot carry anything but an id. */
const UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;
const SHARE_RE = /suno\.com\/s\/[A-Za-z0-9_-]{6,}/i;
const sunoIdFrom = text => {
  const m = String(text || '').trim().match(UUID_RE);
  return m ? m[0].toLowerCase() : '';
};

/* ---------- following a share link ----------
   suno.com/s/<token> is what Suno's Share button hands out, so it is the link a reader is
   likeliest to have — and rejecting it was turning people away at the one moment they
   wanted to contribute. It carries a lookup token rather than an id, and nothing in this
   page can follow it on its own: suno.com sends no CORS headers, so the response arrives
   opaque — status 0, address blank, body unreadable — and a cross-origin frame will not be
   asked where it landed either. Both were tried before this was written.

   So the page borrows somebody else's server to read the share page for it. What comes back
   is never trusted as content: it is scanned for 36 characters of hex and dashes and nothing
   else, and that id then walks exactly the same whitelisted path as one pasted by hand. A
   proxy that lied could only lie about WHICH id it returns — the same power a reader already
   has by pasting a different link — so this opens nothing that was closed.

   The cost is real and belongs in the open: for a share link, the pasted address and the
   reader's own address reach a third party. It happens only for that one shape. A /song/
   link already carries its id and never leaves the page, and if every proxy is down the
   reader is told to open it on Suno, which is where this started.

   To own it rather than borrow it: a Cloudflare Worker of about ten lines — fetch the share
   address with redirect manual, hand back the Location header with an allow-origin header —
   replaces this with one address that answers to us and reads nothing but a header.

   Only a plain proxy will do. A reader service was tried as a second string and had to be
   thrown out: it RENDERS the page, so it came back with dozens of song ids belonging to
   whatever else the site had put on screen, the right one not even first. A dead link that
   attaches a random song is worse than a dead link that says so. */
const SHARE_PROXY = u => 'https://corsproxy.io/?url=' + encodeURIComponent(u);

/* Which id in the page is THE song is not a guess: a share page states it in its canonical
   link, and that is the only place read. The fallback — one /song/ id and no other — exists
   for a page that stops carrying a canonical, and refuses as soon as there is more than one
   candidate. A page with no song in it at all yields nothing, which is what a dead share
   token must do: verified against a made-up token, whose landing page carries a UUID of its
   own and would happily have been mistaken for an answer by any looser reading. */
const CANON_RE = /rel=["']canonical["'][^>]*\/song\/([0-9a-f-]{36})|\/song\/([0-9a-f-]{36})[^>]*rel=["']canonical["']/i;
const SONG_ID_RE = /\/song\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/gi;
function songIdIn(html) {
  const canon = html.match(CANON_RE);
  if (canon) return (canon[1] || canon[2]).toLowerCase();
  const all = [...new Set([...html.matchAll(SONG_ID_RE)].map(m => m[1].toLowerCase()))];
  return all.length === 1 ? all[0] : '';
}
async function resolveShare(url) {
  try {
    const stop = new AbortController();
    const timer = setTimeout(() => stop.abort(), 8000);   // a hung proxy must not hang the form
    const res = await fetch(SHARE_PROXY(url), { signal: stop.signal });
    clearTimeout(timer);
    if (!res.ok) return '';
    const id = songIdIn(await res.text());
    return UUID_RE.test(id) ? id : '';                    // back through the whitelist regardless
  } catch (e) { return ''; }                              // dead, slow, or rate-limited
}

const TITLES = (typeof SONG_TITLES !== 'undefined' && SONG_TITLES) || {};

/* ---------- AN EXCLUSION TEST IS NOT A DEMO ----------
   A demo attached to a prompt that ruled the term OUT demonstrates its ABSENCE. The page
   used to show those under the lesson anyway, flagged violet and labelled "listen for its
   absence" — but a lesson is a place to HEAR the thing, and a track that is silent on it
   teaches nothing there; it just reads as a demo that failed. So they are dropped at load,
   once, BEFORE any count is taken, which is why the masthead totals, the support line and
   the lists cannot disagree — they all read the same already-filtered `ev`.

   Derived from the prompt rather than hand-tagged, so it cannot drift out of step with the
   data, and nothing is removed from lexicon_data.js: the span still occurs literally in the
   prompt, validate.mjs stays satisfied, and the item returns of its own accord the day that
   entry stops excluding the term. */
const isNegUse = (v, span) => !(v.style || '').includes(span) && (v.neg || '').includes(span);
LEX.forEach(c => {
  c.ev = (c.ev || []).filter(e => !isNegUse(byN.get(String(e.n)) || {}, e.span));
});

let curDomain = null, curNeeds = false, curLearn = null;   // curLearn: null | 'learned' | 'unlearned'
/* Difficulty is a SET, unlike the domain rail's single choice, because the useful question
   is nearly always a band rather than a level — "the easy half", "the two hard tiers" — and
   forcing one at a time would make the commonest ask a two-step. Empty means no constraint. */
const curHear = new Set();
const HEAR = {
  1: { name: 'Easy',      say: `You hear it the first time, without being told it is there.` },
  2: { name: 'Medium',    say: `Plainly there once someone names it — you need pointing at it, not training.` },
  3: { name: 'Hard',      say: `Needs repeated listening or an A/B. It is a quality of the sound rather than an event in it.` },
  4: { name: 'Very hard', say: `A trained ear, a minimal pair, or both — and a few of these may not survive the test at all.` }
};
let curPick = null;   // a single card id, chosen at random — a lens over the filters, not one of them

/* ---------- masthead counts derive from the data, so they never drift ---------- */
{
  const evCount = LEX.reduce((n, c) => n + (c.ev || []).length, 0);
  const demoCount = LEX.reduce((n, c) => n + (c.ev || []).reduce(
    (m, e) => m + ((byN.get(String(e.n)) || {}).suno || []).length, 0), 0);
  document.getElementById('sub').innerHTML =
    `<b>${LEX.length}</b> terms across <b>${DOMAINS.length}</b> domains · `
    + `<b>${evCount}</b> pieces of candidate evidence · <b>${demoCount}</b> existing demos in reach · `
    + `${LEX_VERSION} · ${LEX_UPDATED}`;
  document.getElementById('foot').innerHTML =
    `Sound Lexicon · Terminology Lessons ${esc(LEX_VERSION)} · ${esc(LEX_UPDATED)} — `
    + `a companion to the <a href="vocal_timbre_library.html">Vocal Timbre Library</a>. `
    + `Verdicts are stamped with the generator version and date they were made, because a verdict `
    + `about a model that has since changed is worse than no verdict at all.`;
}

/* ---------- domain rail: the "select guitar, see every guitar thing" interaction ---------- */
function buildRail() {
  const rail = document.getElementById('rail');
  const count = id => LEX.filter(c => c.domains.includes(id)).length;
  const group = (label, kind) => {
    const ds = DOMAINS.filter(d => d.kind === kind);
    return `<div class="railgroup"><span class="raillab">${label}</span>`
      + ds.map(d => `<button class="dm" type="button" data-dom="${d.id}">${esc(d.name)}<i>${count(d.id)}</i></button>`).join('')
      + `</div>`;
  };
  /* Its own group rather than a third domain family: difficulty cuts ACROSS domains, and a
     reader picking "Guitar" and "Very hard" together is the point rather than a conflict. */
  const hcount = h => LEX.filter(c => c.hear === h).length;
  const diffs = `<div class="railgroup"><span class="raillab">To hear</span>`
    + [1, 2, 3, 4].map(h => `<button class="dm diff d${h}" type="button" data-hear="${h}"`
        + ` title="${esc(HEAR[h].say)}">${esc(HEAR[h].name)}<i>${hcount(h)}</i></button>`).join('')
    + `</div>`;
  rail.innerHTML =
    `<div class="railgroup"><span class="raillab">All</span>`
    + `<button class="dm on" type="button" data-dom="">Everything<i>${LEX.length}</i></button></div>`
    + group('Physical', 'physical')
    + group('Theory', 'theory')
    + diffs;
}

/* One writer for the difficulty state, because three controls point at it — the rail, the
   two shortcut pills, and the chip on every card. Anything that sets it must leave all
   three agreeing, and the cheapest way to guarantee that is to never set it anywhere else. */
function setHear(levels) {
  curHear.clear();
  levels.forEach(h => curHear.add(h));
  syncHear();
  render();
}
function syncHear() {
  document.querySelectorAll('[data-hear]').forEach(b =>
    b.classList.toggle('on', curHear.has(+b.dataset.hear)));
  const is = set => set.length === curHear.size && set.every(h => curHear.has(h));
  document.getElementById('feasy').classList.toggle('on', is([1, 2]));
  document.getElementById('fhard').classList.toggle('on', is([3, 4]));
}

/* ---------- search blob: the lay-language requirement lives here ----------
   A reader who does not know the word "melisma" must still find it by typing
   "runs", or by typing a phrase from the plain-language gloss. Domain names and
   the titles of attached demo songs are folded in too. */
function blob(c) {
  const evNames = (c.ev || []).map(e => {
    const v = byN.get(String(e.n)) || {};
    const songs = (v.suno || []).map(id => TITLES[id] || '').join(' ');
    return `${v.name || ''} ${v.fam || ''} ${e.span} ${songs}`;
  }).join(' ');
  /* Both spellings go in: someone typing "80s" and someone typing "1980s" should both
     land on gated reverb. Storing only the canonical form would quietly fail the shorter one. */
  const eras = [c.first, ...(c.peak || [])];
  const eraBlob = eras.concat(eras.map(e => e.replace(/^\d\d/, ''))).join(' ');
  const ex = c.exemplar ? `${c.exemplar.title} ${c.exemplar.artist} ${c.exemplar.year}` : '';
  /* Both the label and the level, so "very hard" and "4/4" both land, and so does someone
     typing "easy to hear" into the box instead of finding the pill. */
  const hearBlob = `${HEAR[c.hear].name} to hear ${c.hear}/4`;
  return [c.term, c.sounds, c.gloss, c.myth, c.known, c.origin, c.range, c.res.note, eraBlob, ex, hearBlob,
    (c.syn || []).join(' '), c.domains.map(d => (domById.get(d) || {}).name).join(' '),
    (c.kinds || []).join(' '), c.nature, evNames].join(' ').toLowerCase();
}
LEX.forEach(c => c._blob = blob(c));

/* ---------- DISCOVERY: the rest of the corpus that uses this wording ----------
   Curated evidence is the lesson — each item carries a hand-written reason it was
   chosen, and nothing can generate that. But the corpus keeps growing, and without a
   path from a new prompt to the card that documents its term, the page drifts quietly.

   Three decisions here are specifically about not becoming a maintenance burden:

   1. Matching happens at RUNTIME against LIB. There is no generated list, no cache file
      and no sync step, so writing a new prompt that says "sidechain" is the entire act of
      attaching it — the card picks it up on next load with nothing to run.
   2. The vocabulary is short STEMS, not inflections ('brush' catches brushed/brushes/
      brushing). One or two strings per card, and no list of word forms to maintain.
   3. Computed ONCE at load, not per render. Cost is cards × entries, and that product is
      what grows; doing it on every keystroke of the search box would not survive a
      hundred cards against five thousand prompts. */
const MORE_CHUNK = 12;

/* The recorded span must be a literal that really occurs, so pull it back out of the
   prompt with its original casing rather than assuming the stem's. */
function literalIn(prompt, stems) {
  const low = prompt.toLowerCase();
  for (const s of stems) {
    const i = low.indexOf(s);
    if (i >= 0) return prompt.slice(i, i + s.length);
  }
  return '';
}
/* The words this card watches for. Hand-written `match` when there is one, otherwise the
   spans its own evidence already uses. */
const stemsOf = c => ((c.match && c.match.length) ? c.match : [...new Set((c.ev || []).map(e => e.span))])
  .map(s => String(s).toLowerCase());

LEX.forEach(c => {
  const stems = stemsOf(c);
  const attached = new Set((c.ev || []).map(e => String(e.n)));
  c._more = LIB.filter(v => {
    const id = String(v.n ?? v.id);
    if (attached.has(id)) return false;
    if (!(v.suno || []).length) return false;    // nothing to listen to isn't an example
    // Style only, never the negative: a prompt that EXCLUDES the wording is not an example
    // of it. Matching both put more exclusions than examples into this list.
    return stems.some(s => (v.style || '').toLowerCase().includes(s));
  }).map(v => ({
    n: v.n ?? v.id,
    span: literalIn(v.style || '', stems)
  }));
});

/* ---------- SUPPORT VOTES ----------
   "Does this track actually demonstrate this term?" — one click, per listener,
   accumulating. The judgement is still made by ear (design doc §5); this just lets it
   be recorded by anyone listening rather than only by the curator, and lets agreement
   build up instead of resting on a single verdict.

   The vote is per (term, demo) PAIR, never per track: the same recording can plainly
   demonstrate one term and say nothing about another, so `lexev:<cardId>:<entry>` is
   the only key that means anything.

   Stored in the same Firebase `likes` map the hearts use — deliberately, because that
   path already exists, is already open, and its rule allows a counter to move by
   exactly ±1 per write, so a vote count cannot be inflated. No new rule needed. */
/* ---------- LEARNED ----------
   Which lessons you have taken in. Deliberately private and per-browser: it is your
   progress through the material, not a claim about the material, so it has no business
   in the shared database next to the votes. Stored in localStorage rather than an actual
   cookie — same client-side result, but it is never attached to a request, has room to
   grow, and matches how the votes and hearts on this page already persist. */
const LEARNED_KEY = 'lex_learned';
let learned = new Set();
try { learned = new Set(JSON.parse(localStorage.getItem(LEARNED_KEY) || '[]')); } catch (e) {}
const saveLearned = () => { try { localStorage.setItem(LEARNED_KEY, JSON.stringify([...learned])); } catch (e) {} };

const VOTES_KEY = 'lex_votes';
/* A vote is keyed by what it is about. Library entries are numbered, so anything shaped like
   a Suno id can only be a track a listener attached — which is why the two live in one map
   without a flag to keep in step: the id itself says which it is. */
const voteKey = (cardId, n) =>
  (UUID_RE.test(String(n)) ? 'lexadd:' : 'lexev:') + cardId + ':' + n;
let myVotes = new Set();
try { myVotes = new Set(JSON.parse(localStorage.getItem(VOTES_KEY) || '[]')); } catch (e) {}
const saveVotes = () => { try { localStorage.setItem(VOTES_KEY, JSON.stringify([...myVotes])); } catch (e) {} };

const voteCount = (cardId, n) => (window.__likeCounts || {})[voteKey(cardId, n)] || 0;

/* A term counts as demonstrated when at least one listener has vouched for at least
   one of its demos. Zero votes reads as "not yet demonstrated" rather than as anything
   worse — silence here is nobody having played it, not a demo that failed. */
/* ---------- A TRACK A LISTENER ATTACHED ----------
   "I know a better example of this than any of these." Without somewhere to put that, the
   only way to act on it was to tell the curator, so it mostly went unsaid.

   It needs no table of its own and no new database rule, because the id goes in the KEY:
   `lexadd:<cardId>:<suno id>`, a counter in the same `likes` map the hearts and the votes
   already share. Everything follows from that one decision — the ±1 rule still guards it,
   the existing listener already replicates it to every reader, the addition IS its first
   vote, and a track nobody vouches for any more (count back to zero) simply stops being
   listed. Nothing to moderate, nothing to clean up.

   The index is rebuilt from the counts map rather than accumulated, so a snapshot from
   the server is always the last word on what is attached. */
let addIndex = new Map();                // cardId -> [{ n: suno id, src:'add', i }]
function reindexAdds() {
  const counts = window.__likeCounts || {};
  addIndex = new Map();
  for (const k in counts) {
    if (counts[k] <= 0 || k.slice(0, 7) !== 'lexadd:') continue;
    const rest = k.slice(7), cut = rest.lastIndexOf(':');
    if (cut < 1) continue;
    const cardId = rest.slice(0, cut), id = sunoIdFrom(rest.slice(cut + 1));
    if (!id) continue;                   // anything not an id is not something we will render
    if (!addIndex.has(cardId)) addIndex.set(cardId, []);
    addIndex.get(cardId).push(id);
  }
  /* Sorted, so every reader sees the same order for the same data — an order that depended
     on key enumeration would differ between browsers for no reason a reader could explain. */
  for (const [k, ids] of addIndex) addIndex.set(k, ids.sort().map((n, i) => ({ n, src: 'add', i })));
}
const added = c => addIndex.get(c.id) || [];

/* The examples shown under a lesson: everything curated, PLUS any discovered example
   somebody has vouched for, PLUS any track a listener attached.

   The first build kept those strictly apart, and that was wrong in a way a vote exposes
   immediately: vouch for a discovered take and it sorted to the top of a list that stays
   collapsed, so the one example a person had actually confirmed was the one they could not
   see. A vote is the whole signal of what deserves prominence — where the example came
   from is a detail of how it was found. So a vouched-for discovery outranks a curated
   example with no support, and says plainly that it has not been written up yet. */
const SRC_RANK = { ev: 0, more: 1, add: 2 };   // how a tie breaks: curated, then found, then attached
function examples(c) {
  const curated = (c.ev || []).map((e, i) => ({ ...e, src: 'ev', i }));
  const promoted = (c._more || [])
    .map((m, i) => ({ ...m, src: 'more', i }))
    .filter(m => voteCount(c.id, m.n) > 0);
  return [...curated, ...promoted, ...added(c)]
    .filter(x => x.state !== 'rejected')
    .sort((a, b) => (voteCount(c.id, b.n) - voteCount(c.id, a.n))
      || (SRC_RANK[a.src] - SRC_RANK[b.src]) || (a.i - b.i));
}

function support(c) {
  let backed = 0, votes = 0, total = 0;
  for (const e of examples(c)) {
    votes += voteCount(c.id, e.n);
    total++;
    if (voteCount(c.id, e.n) > 0) backed++;
  }
  return { backed, votes, total };
}

/* ---------- the standing note, which is not standing ----------
   This used to open "Nothing here has been verified by ear yet", which was true on the day
   it was typed and quietly stopped being true the moment the votes started arriving — a
   frozen sentence sitting on top of a live page, telling readers the opposite of what the
   cards underneath them said. Everything else here derives its counts at runtime for exactly
   this reason, and this was the last thing that did not.

   It also promised something the mechanism does not do. A vote marks a DEMO as one a
   listener could hear the term in. The verdict on the card is a different judgement, written
   by hand in lexicon_data.js, and voting does not move it — so the note now says which is
   which rather than implying that enough hearts settle the question. */
function caveatLine() {
  const heard = LEX.filter(c => support(c).backed > 0).length;
  /* Split out, because these two are unheard for opposite reasons and the sentence used to
     claim both had candidates waiting. A card with no evidence at all is not queued for a
     listen; there is nothing to queue. */
  const ahead = LEX.filter(c => !support(c).total).length;
  const waiting = LEX.length - heard - ahead;
  return `<b>${heard ? `${heard} of ${LEX.length} terms have been heard.` : 'Nothing here has been heard yet.'}</b> `
    + (waiting
      ? `${!heard ? waiting : waiting + heard === LEX.length ? 'Every other' : `Another ${waiting}`} card${waiting === 1 ? '' : 's'} `
        + `${waiting === 1 ? 'has' : 'have'} candidates attached and nobody has played `
        + `${waiting === 1 ? 'it' : 'them'} yet — the <em>Needs a listen</em> filter is that list. `
      : `Every card with evidence under it has a demo somebody vouched for. `)
    + (ahead
      ? `<b>${ahead}</b> ${ahead === 1 ? 'card is' : 'cards are'} ahead of the evidence entirely: `
        + `no prompt in the library has ever asked for ${ahead === 1 ? 'that term' : 'those terms'}, `
        + `and ${ahead === 1 ? 'it was' : 'they were'} written anyway, because what the prompts `
        + `happen to say is not the same question as what is worth knowing. `
      : '')
    + `The evidence under each is drawn from prompts that already exist in the `
    + `<a href="vocal_timbre_library.html">Vocal Timbre Library</a>, with the exact wording `
    + `highlighted; a few were commissioned to test their term and nothing else. Play one, and `
    + `<b>vote it up</b> if you can hear the term in it. What that does not do is settle the `
    + `card's verdict — that line reads <em>untested</em> everywhere and is a separate `
    + `judgement, because a demo one listener finds convincing is not yet a term the generator `
    + `can be relied on to distinguish.`
    /* The scale is a judgement, and saying so is the price of putting a number on a card.
       It is also a different axis from the verdict above it, which is the confusion worth
       heading off: a term can be trivially easy to hear and still be one the generator
       cannot produce on request. */
    + ` <br><br><b>Every card also carries how hard the term is to HEAR</b>, one to four, `
    + `coloured along the left edge — ${[1, 2, 3, 4].map(h =>
        `<b style="color:var(--d${h})">${HEAR[h].name.toLowerCase()}</b>`).join(', ')}. `
    + `That is our judgement of what it costs a listener, not a measurement, and it is a `
    + `separate question from whether the generator can produce the term at all: plenty of `
    + `things on the <b style="color:var(--d1)">easy</b> end may still fail their test.`;
}

function supportLine(c) {
  const { backed, votes, total } = support(c);
  /* A card with nothing under it is not a card that failed. Some terms have never been
     asked for in a prompt — the library's vocabulary records what we happened to write, not
     what is worth knowing — and saying so plainly is more useful than "0 candidates
     attached", which reads as a bug. It also names the thing to do about it. */
  if (!total) return c.corpus === 'absent'
    ? `<b>Not in the library's vocabulary.</b> No prompt here has ever asked for this term, `
      + `so there is nothing to play yet — the lesson is ahead of the evidence. Written `
      + `because it is worth knowing, not because a prompt needed it.`
    : `Nothing attached yet.`;
  // Deliberately does NOT say "drawn from existing prompts": most evidence was mined from
  // the corpus, but some was commissioned for its card, and the line has to be true of both.
  if (!backed) return `Documented, not yet demonstrated. ${total} candidate${total === 1 ? '' : 's'} `
    + `attached — no one has vouched for ${total === 1 ? 'it' : 'any of them'} yet.`;
  return `<b>${backed} of ${total}</b> demos vouched for as demonstrating this term `
    + `(${votes} vote${votes === 1 ? '' : 's'}).`;
}

/* ---------- demo tiles ---------- */
function tiles(v) {
  const ids = (v.suno || []).filter(s => /^[0-9a-f-]{30,}$/i.test(s));
  if (!ids.length) return `<span class="nodemo">no demo attached to this entry</span>`;
  return `<div class="tiles">` + ids.map(id => {
    const t = TITLES[id] || 'Demo';
    return `<button class="tile" type="button" data-uuid="${esc(id)}" data-title="${esc(t)}" title="${esc(t)} — play">`
      + `<img src="https://cdn2.suno.ai/image_${esc(id)}.jpeg" alt="" loading="lazy">`
      + `<span class="play">▶</span></button>`;
  }).join('') + `</div>`;
}

/* ---------- one card ---------- */
function cardHTML(c) {
  const doms = c.domains.map(d => `<span class="chip dom">${esc((domById.get(d) || {}).name || d)}</span>`).join('');
  const kinds = c.kinds.map(k => `<span class="chip kind"><b>${k === 'instrument' ? 'Instrument / tool' : 'Technique'}</b></span>`).join('');
  const nat = `<span class="chip nat">${c.nature === 'momentary' ? 'Momentary event' : 'Continuous'}</span>`;
  /* Stays visible on a closed card, unlike era and nature. It is the one piece of metadata
     worth having before you decide whether to open the thing. */
  const diff = `<span class="chip diff" data-hear="${c.hear}"
    title="Difficulty to hear: ${esc(HEAR[c.hear].say)} Click to see the rest of this tier."
    ><span class="n">${c.hear}/4</span> ${esc(HEAR[c.hear].name)} to hear</span>`;
  const eraChips = `<span class="chip era" data-era="${esc(c.first)}" title="First appeared. Click to search this decade.">from ${esc(c.first)}</span>`
    + ((c.peak || []).length
        ? `<span class="chip era pk" data-era="${esc(c.peak[0])}" title="Decades that popularised it. Click to search.">popular ${c.peak.map(esc).join(' &middot; ')}</span>`
        : '');

  const stateLine = `<div class="evstate" data-sup="${esc(c.id)}">${supportLine(c)}</div>`;

  /* Best-supported first. Ties keep the authored order, which is curated — the cleanest
     test case is written first on purpose — so an unvoted list still reads as a considered
     sequence. `i` stays the index into its OWN source list, because the prompt pop-out
     addresses examples by position within `ev` or `_more`. */
  const evHTML = examples(c).map(x => {
    const attachedByReader = x.src === 'add';
    /* An attached track is addressed by its Suno id, so it resolves through bySuno rather
       than byN — and it may not resolve at all, which is fine: somebody can vouch for a
       track this library never made. */
    const v = (attachedByReader ? bySuno.get(String(x.n)) : byN.get(String(x.n))) || {};
    const n = voteCount(c.id, x.n);
    const mine = myVotes.has(voteKey(c.id, x.n));
    const found = x.src === 'more';
    const num = attachedByReader
      ? (v.n != null ? `<span class="evn">#${esc(v.n)}</span>` : '')
      : `<span class="evn">#${esc(x.n)}</span>`;
    const name = attachedByReader
      ? (v.name || TITLES[x.n] || 'a track from outside the library')
      : (v.name || 'unknown entry');
    return `<div class="evitem${x.state === 'rejected' ? ' st-rejected' : ''}${n > 0 ? ' supported' : ''}"
                 data-ev="${esc(c.id)}|${esc(x.n)}" data-idx="${x.i}" data-src="${x.src}">
      <div class="evhead">
        ${num}
        <span class="evname">${esc(name)}</span>
        ${x.span ? `<span class="evspan">${esc(x.span)}</span>` : ''}
        ${found ? `<span class="evstateT found">vouched for &middot; not written up</span>` : ''}
        ${attachedByReader ? `<span class="evstateT addedt">attached by a listener</span>` : ''}
      </div>
      ${attachedByReader
        ? `<p class="evwhy">Attached by somebody who thought it demonstrates the term better
             than what was already here. The vote is the whole claim — nobody has written up
             what to listen for, and no curator has agreed.</p>`
        : found
        ? `<p class="evwhy">Found by wording rather than chosen, and promoted here because
             somebody vouched for it. It has no write-up yet explaining what to listen for.</p>`
        : `<p class="evwhy">${esc(x.why)}</p>`}
      <div class="evrow">
        ${attachedByReader && v.n == null ? ''
          : `<button class="btn" type="button" data-prompt="${esc(c.id)}|${esc(attachedByReader ? x.n : x.i)}|${x.src}">Prompt</button>`}
        ${attachedByReader ? tiles({ suno: [x.n] }) : tiles(v)}
        <button class="vote${mine ? ' on' : ''}${!mine && n > 0 ? ' has' : ''}" type="button"
          data-vote="${esc(c.id)}|${esc(x.n)}"
          title="${mine
            ? 'You vouched for this — click to take it back'
            : 'I hear the term in this track'}">
          <span class="arrow">▲</span> Supports <span class="vc">${n || ''}</span>
        </button>
      </div>
    </div>`;
  }).join('');

  const moment = c.nature === 'momentary'
    ? `<p class="moment"><b>A momentary event.</b> There is no way to link you to the exact
       moment — every seek mechanism was tested on 2026-08-21 and none of them work. So the
       time gets named in words on the card, and a purpose-built demo should place the event
       early, where the scrub is short.</p>` : '';

  const r = c.res || {};
  const stamp = r.verdict === 'untested'
    ? `<span class="stamp">no verdict yet — nothing to stamp</span>`
    : `<span class="stamp">${esc(r.model || '?')} · ${esc(r.date || '?')}</span>`;

  const isLearned = learned.has(c.id);
  const open = cardOpen.has(c.id);
  /* What the bar has to answer is "is this the lesson I want?" — so the term, the one-line
     definition, the domain it belongs to, and whether its demos have been vouched for. Not
     the sound description: that one is the lesson itself and reads badly cut off. */
  const sup = support(c);
  const meta = `${sup.total} example${sup.total === 1 ? '' : 's'}`
    + (sup.backed ? ` &middot; <b>${sup.backed} vouched</b>` : '');
  return `<article class="card d${c.hear}${isLearned ? ' learned' : ''}${open ? ' open' : ''}" id="${esc(c.id)}" data-id="${esc(c.id)}">
    <div class="likewrap">
      <button class="like" type="button" data-like="${esc(c.id)}" aria-label="Like">♥</button>
      <span class="lcount" data-lc="${esc(c.id)}"></span>
    </div>
    <div class="chead" data-card="${esc(c.id)}" role="button" tabindex="0"
         aria-expanded="${open ? 'true' : 'false'}"
         title="${open ? 'Collapse this lesson' : 'Open this lesson'}">
      <div class="ctop">
        <span class="caret2">&#9656;</span>
        <span class="term">${esc(c.term)}</span>
        <a class="anchor" href="#${esc(c.id)}" title="Link straight to this card">#${esc(c.id)}</a>
        <button class="learn${isLearned ? ' on' : ''}" type="button" data-learn="${esc(c.id)}"
          title="${isLearned ? 'Marked as learned — click to unmark' : 'Mark this lesson as learned'}">
          ${isLearned ? '&#10003; Learned' : 'Mark learned'}</button>
        <span class="cmeta" data-cmeta="${esc(c.id)}">${meta}</span>
      </div>
      <div class="chips">${diff}${doms}${kinds}${nat}${eraChips}</div>
      <p class="csum">${esc(c.gloss)}</p>
    </div>

    <div class="cbody">
    <div class="hear">

      <div class="lab">What you hear</div>
      <p>${esc(c.sounds)}</p>
    </div>

    <div class="blk">
      <div class="lab">What it actually is</div>
      <div class="body">${esc(c.gloss)}</div>
    </div>

    <div class="blk">
      <div class="lab">Also called</div>
      <div class="syn">${(c.syn || []).map(s => `<span>${esc(s)}</span>`).join('')}</div>
    </div>

    <div class="blk myth">
      <div class="lab">Common mistake</div>
      <div class="body">${esc(c.myth)}</div>
    </div>

    <div class="blk twocol">
      <div><div class="lab">Known for</div><div class="body">${esc(c.known)}</div></div>
      <div><div class="lab">Origin</div><div class="body mut">${esc(c.origin)}</div></div>
    </div>

    <div class="blk">
      <div class="lab">Range</div>
      <div class="body">${esc(c.range)}</div>
    </div>

    ${c.exemplar ? `<div class="exemplar">
      <div class="lab">${c.exemplar.kind === 'popularised' ? 'The record that popularised it' : 'The clearest example'}</div>
      <p class="exrec"><a class="exlink" href="${esc(ytLink(c.exemplar))}" target="_blank" rel="noopener noreferrer"
         title="Find this on YouTube (opens in a new tab)"><b>${esc(c.exemplar.title)}</b> &middot; ${esc(c.exemplar.artist)} &middot; ${esc(c.exemplar.year)} <span class="ext">&#8599;</span></a></p>
      <p class="exlisten">${esc(c.exemplar.listen)}</p>
    </div>` : ''}

    ${moment}

    <div class="res">
      <div class="reshead">
        <span class="lab">Does the generator hear it?</span>
        <span class="verdict v-${esc(r.verdict)}">${esc(r.verdict)}</span>
        ${stamp}
      </div>
      <div class="body mut">${esc(r.note)}</div>
    </div>

    <div class="ev">
      <div class="lab">Evidence</div>
      ${stateLine}
      <div class="evlist" data-list="${esc(c.id)}">${evHTML}</div>
      ${moreBlock(c)}
      ${addBlock(c)}
    </div>
    </div>
  </article>`;
}

/* ---------- "more examples" ----------
   Deliberately NOT presented as evidence. These entries were never chosen, carry no
   reason, and nobody has said they demonstrate anything — the button says so. What they
   are is the honest picture of how heavily a term gets used, and a route by which a new
   prompt reaches the card that documents it.

   For a term like four-on-the-floor the count is itself a finding: 86 prompts lean on it. */
const moreOpen = new Map();          // cardId -> how many are currently shown

/* Anything vouched for has moved up into the evidence list, so it must not also sit
   here — one example, one place. */
const unpromoted = c => (c._more || []).filter(m => voteCount(c.id, m.n) === 0);

function moreBlock(c) {
  const n = unpromoted(c).length;
  if (!n) return '';
  const shown = moreOpen.get(c.id) || 0;
  return `<div class="more">
    <button class="morebtn${shown ? ' open' : ''}" type="button" data-moretoggle="${esc(c.id)}">
      <span class="caret">▾</span> ${n} more example${n === 1 ? '' : 's'}
      <span class="moremeta">uses this wording · not curated, not vouched for</span>
    </button>
    <div class="morelist${shown ? ' open' : ''}" data-morelist="${esc(c.id)}">${moreItems(c, shown)}</div>
  </div>`;
}

function moreItems(c, shown) {
  if (!shown) return '';
  /* No sorting needed: a vote promotes an example out of this list entirely, so
     everything left here has zero support and keeps corpus order. */
  const ordered = c._more
    .map((m, i) => ({ m, i }))
    .filter(({ m }) => voteCount(c.id, m.n) === 0);   // promoted ones render as evidence
  const slice = ordered.slice(0, shown);
  const rows = slice.map(({ m, i }) => {
    const v = byN.get(String(m.n)) || {};
    const cnt = voteCount(c.id, m.n), mine = myVotes.has(voteKey(c.id, m.n));
    /* Controls come FIRST so Prompt, the demo icons and the vote sit at the same left edge
       as the curated evidence above. Previously the metadata led and the controls were
       pushed right with margin-left:auto, so expanding this list made everything jump
       across the card. The name is what gives way now — it truncates instead. */
    return `<div class="mitem${cnt > 0 ? ' supported' : ''}" data-ev="${esc(c.id)}|${esc(m.n)}">
      <span class="mctl">
        <button class="btn" type="button" data-prompt="${esc(c.id)}|${i}|more">Prompt</button>
        ${tiles(v)}
        <button class="vote${mine ? ' on' : ''}${!mine && cnt > 0 ? ' has' : ''}" type="button"
          data-vote="${esc(c.id)}|${esc(m.n)}"
          title="${mine
            ? 'You vouched for this — click to take it back'
            : 'I hear the term in this track'}">
          <span class="arrow">▲</span> Supports <span class="vc">${cnt || ''}</span>
        </button>
      </span>
      <span class="mmeta">
        <span class="evn">#${esc(m.n)}</span>
        <span class="mname">${esc(v.name || '')}</span>
        ${m.span ? `<span class="evspan">${esc(m.span)}</span>` : ''}
      </span>
    </div>`;
  }).join('');
  const left = ordered.length - slice.length;
  return rows + (left
    ? `<div class="morefoot">
         <button class="btn" type="button" data-moremore="${esc(c.id)}">Show ${Math.min(left, MORE_CHUNK)} more</button>
         <span class="morenote">${left} still hidden</span>
       </div>`
    : `<div class="morefoot"><span class="morenote">That is all ${ordered.length} of them.</span></div>`);
}

/* Expansion patches only the affected card, so opening a list of 86 never re-renders
   the page or moves anything the reader was looking at. */
function paintMore(cardId) {
  const c = LEX.find(x => x.id === cardId); if (!c) return;
  const shown = moreOpen.get(cardId) || 0;
  const list = document.querySelector(`[data-morelist="${cardId}"]`);
  const btn = document.querySelector(`[data-moretoggle="${cardId}"]`);
  if (!list || !btn) return;
  list.innerHTML = moreItems(c, shown);
  list.classList.toggle('open', shown > 0);
  btn.classList.toggle('open', shown > 0);
  markPlaying();                        // freshly rendered tiles need the marker too
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-moretoggle]');
  if (t) {
    const id = t.dataset.moretoggle;
    moreOpen.set(id, (moreOpen.get(id) || 0) ? 0 : MORE_CHUNK);
    paintMore(id);
    return;
  }
  const m = e.target.closest('[data-moremore]');
  if (m) {
    const id = m.dataset.moremore;
    moreOpen.set(id, (moreOpen.get(id) || 0) + MORE_CHUNK);
    paintMore(id);
  }
});

/* ---------- filter + render ---------- */
const searchWords = () => {
  const term = document.getElementById('q').value.trim().toLowerCase();
  return term ? term.split(/\s+/) : [];
};

/* Every filter except the random pick, which sits on top of these rather than beside them:
   "one at random" has to mean one out of whatever is already being looked at, or picking a
   lesson while a domain is selected would jump you out of that domain. */
function passes(c, words) {
  if (curDomain && !c.domains.includes(curDomain)) return false;
  if (curHear.size && !curHear.has(c.hear)) return false;
  /* "Needs a listen" is a queue of things somebody could go and play. Live votes, not the
     file — and a card with nothing attached is not in the queue, because there is nothing
     there to listen to; it needs a prompt written first, which is a different job. */
  if (curNeeds && (support(c).backed > 0 || !support(c).total)) return false;
  if (curLearn === 'learned' && !learned.has(c.id)) return false;
  if (curLearn === 'unlearned' && learned.has(c.id)) return false;
  return words.every(w => c._blob.includes(w));
}
const pickable = words => LEX.filter(c => !learned.has(c.id) && passes(c, words));

function render() {
  reindexAdds();                        // cards are about to read it
  const words = searchWords();
  const list = curPick ? LEX.filter(c => c.id === curPick) : LEX.filter(c => passes(c, words));
  document.getElementById('cards').innerHTML = list.length
    ? list.map(cardHTML).join('')
    : `<p class="body mut" style="padding:26px 2px">No term matches that. Try a plainer word — the cards are indexed by how a listener would describe the sound, not only by the technical name.</p>`;
  document.getElementById('hits').textContent = `${list.length} of ${LEX.length}`;
  const done = LEX.filter(x => learned.has(x.id)).length;
  document.getElementById('progress').innerHTML =
    done ? `<b>${done}</b> / ${LEX.length} learned` : `none marked learned yet`;
  const d = curDomain && domById.get(curDomain);
  document.getElementById('dblurb').textContent = d ? d.blurb : '';
  /* The pill reports what it can do rather than being clicked to find out: nothing left to
     draw from is a state worth seeing, and it is the state a reader is working towards. */
  const rand = document.getElementById('frandom'), pool = pickable(words).length;
  rand.classList.toggle('on', !!curPick);
  rand.disabled = !pool;
  rand.title = pool ? `One of the ${pool} lessons here you have not marked learned — click again for a different one`
    : curLearn === 'learned' ? 'Nothing to draw from — this view is the lessons you HAVE learned'
    : 'Nothing left to draw from — every lesson in this view is marked learned';
  /* Narrow the search to a single lesson and there is nothing left to choose between, so
     opening it saves a click that has no alternative. Two or more stay shut. */
  if (list.length === 1) cardOpen.add(list[0].id);
  document.querySelectorAll('.card').forEach(el => {
    const open = cardOpen.has(el.dataset.id);
    el.classList.toggle('open', open);
    const h = el.querySelector('.chead');
    if (h) h.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  syncExpandAll();
  promotedSig = currentPromotedSig();   // set BEFORE renderCounts, or refreshVotes recurses
  needsSig = currentNeedsSig();         // likewise — see renderCounts
  renderCounts();
  markPlaying();                        // cards were just rebuilt — restore the marker
}

/* ---------- "I know a better one" ----------
   Kept behind a toggle: 99 cards each showing an open form would read as a page asking to be
   filled in, and the common case is reading, not contributing. Draft text and the last
   message survive a re-render — a vote landing from another reader must not eat what someone
   is half way through typing. */
const addOpen = new Set();               // cardId -> form showing
const addDraft = new Map();              // cardId -> what is typed but not yet added
const addMsg = new Map();                // cardId -> [message, ok?]

function addBlock(c) {
  const open = addOpen.has(c.id);
  const [msg, ok] = addMsg.get(c.id) || ['', true];
  return `<div class="addev">
    <button class="btn" type="button" data-addtoggle="${esc(c.id)}"
      title="Attach a track of your own to this lesson">${open ? '&times; Never mind' : '+ I know a better example'}</button>
    <div class="addform${open ? ' open' : ''}">
      <input class="addin" type="text" data-addin="${esc(c.id)}" spellcheck="false"
             placeholder="Paste a Suno link of a track that demonstrates this — a share link works too"
             value="${esc(addDraft.get(c.id) || '')}">
      <button class="btn" type="button" data-addgo="${esc(c.id)}">Attach &amp; vouch</button>
      ${msg ? `<p class="addmsg${ok ? '' : ' bad'}">${esc(msg)}</p>` : ''}
      <p class="addnote">Attaching it counts as your vote. Take the vote back and it is gone
        again — for everyone, if nobody else has vouched for it.</p>
    </div>
  </div>`;
}

/* One path for every vote on the page, whether it came from the button under an example or
   from attaching a track: optimistic locally, rolled back if the database refuses. */
function castVote(cardId, n) {
  const key = voteKey(cardId, n);
  const had = myVotes.has(key), delta = had ? -1 : 1;

  had ? myVotes.delete(key) : myVotes.add(key);
  saveVotes();
  window.__likeCounts = window.__likeCounts || {};
  window.__likeCounts[key] = Math.max(0, (window.__likeCounts[key] || 0) + delta);
  reindexAdds();
  refreshVotes();

  const p = window.__bumpLike && window.__bumpLike(key, delta);
  if (p && p.catch) p.catch(() => {                       // roll back a refused vote
    had ? myVotes.add(key) : myVotes.delete(key);
    saveVotes();
    window.__likeCounts[key] = Math.max(0, (window.__likeCounts[key] || 0) - delta);
    reindexAdds();
    refreshVotes();
  });
}

/* Attaching is a vote too — the question is only WHICH thing gets voted for. A track that is
   already under the lesson must not arrive a second time under a different key, so a paste
   that names one is redirected to it. That covers the likeliest paste of all: the demo the
   reader just played from this very card. */
const addBusy = new Set();               // cardId -> a share link is being followed right now

function attachTrack(cardId) {
  const c = LEX.find(x => x.id === cardId); if (!c) return;
  if (addBusy.has(cardId)) return;       // a second Enter must not start a second lookup
  const input = document.querySelector(`[data-addin="${cardId}"]`);
  const raw = input ? input.value : '';
  const say = (m, ok) => { addMsg.set(cardId, [m, ok]); rerender(); };

  const id = sunoIdFrom(raw);
  if (id) return finishAttach(cardId, id, say);

  const share = raw.match(SHARE_RE);
  if (!share) return say('That is not a Suno link — open the song on Suno and copy the address bar.', false);

  /* The draft is deliberately NOT cleared here: until an id comes back there is nothing to
     attach, and a reader whose proxy times out must still have their link in the box. */
  addBusy.add(cardId);
  say('Following that share link…', true);
  resolveShare('https://' + share[0]).then(found => {
    addBusy.delete(cardId);
    if (found) finishAttach(cardId, found, say);
    else say('That share link could not be followed just now. Open it on Suno and copy the '
      + 'address bar link instead — that one carries the id.', false);
  });
}

/* Everything from here on is the same whether the id was pasted or followed. */
function finishAttach(cardId, id, say) {
  const c = LEX.find(x => x.id === cardId); if (!c) return;
  const hasId = n => ((byN.get(String(n)) || {}).suno || []).includes(id);
  const here = examples(c).find(x => x.src === 'add' ? x.n === id : hasId(x.n));
  const inMore = (c._more || []).find(m => hasId(m.n));
  const target = here ? here.n : (inMore ? inMore.n : id);

  if (myVotes.has(voteKey(cardId, target)))
    return say('You have already vouched for that track under this lesson.', false);

  addDraft.delete(cardId);
  castVote(cardId, target);
  say(here ? 'Already attached here — vouched for it instead.'
    : inMore ? 'That one was already in "more examples" — vouched for, and moved up.'
    : 'Attached, and vouched for.', true);
}

/* Membership changed, so patching cannot express it — rebuild, holding the reader's place. */
function rerender() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ---------- likes ----------
   Keys are namespaced with a "lex:" prefix. The vocal library keys its hearts by bare
   entry number in the same Firebase namespace, so without this prefix card 1 here would
   share a counter with entry 1 there (design doc §9). */
const LIKES_KEY = 'lex_likes';
const likeId = id => 'lex:' + id;
function loadLikes() { try { return new Set(JSON.parse(localStorage.getItem(LIKES_KEY) || '[]')); } catch (e) { return new Set(); } }
function saveLikes(s) { try { localStorage.setItem(LIKES_KEY, JSON.stringify([...s])); } catch (e) {} }
let mine = loadLikes();
function renderCounts() {
  reindexAdds();                        // a snapshot may have brought someone else's attachment
  const counts = window.__likeCounts || {};
  document.querySelectorAll('[data-lc]').forEach(el => {
    const n = counts[likeId(el.dataset.lc)] || 0;
    el.textContent = n || '';
  });
  document.querySelectorAll('[data-like]').forEach(b => b.classList.toggle('on', mine.has(b.dataset.like)));
  /* Votes arriving from elsewhere shouldn't yank the page out from under a reader, so
     patch them in place — unless a vote just moved a card out of "Needs a listen", which
     is a membership change no amount of patching can express.

     The test has to be on the MEMBERSHIP, not on the filter being active. Re-rendering
     whenever the pill was on meant render() → renderCounts() → render() with nothing to
     stop it, and turning the pill on froze the tab outright. */
  if (curNeeds && currentNeedsSig() !== needsSig) {
    needsSig = currentNeedsSig();
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
  } else refreshVotes();
}
window.__renderCounts = renderCounts;

/* A vote can change WHICH examples belong under a lesson, not just their order — the
   first vote on a discovered take promotes it out of "more examples" and into the
   evidence list. Moving nodes cannot express that, so membership changes force a real
   re-render. This signature is how we tell the two apart. */
let promotedSig = '';
const currentPromotedSig = () => LEX
  .map(c => c.id + ':' + (c._more || []).filter(m => voteCount(c.id, m.n) > 0).map(m => m.n).join('.')
     + '+' + added(c).map(a => a.n).join('.'))    // someone else attaching a track lands here
  .join('|');

/* And the same trick for "Needs a listen", whose membership a vote can change too: one
   bit per card, backed or not. Only computed while the pill is on, which is the only time
   it can decide anything. */
let needsSig = '';
const currentNeedsSig = () => curNeeds ? LEX.map(c => support(c).backed > 0 ? '1' : '0').join('') : '';

/* Patch vote UI in place: button state, count, item highlight, and the card's header line. */
function refreshVotes() {
  const sig = currentPromotedSig();
  if (sig !== promotedSig) {            // something got promoted or demoted — rebuild
    promotedSig = sig;
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    return;
  }
  document.querySelectorAll('[data-vote]').forEach(b => {
    const [cardId, n] = b.dataset.vote.split('|');
    const key = voteKey(cardId, n), c = voteCount(cardId, n), mineV = myVotes.has(key);
    b.classList.toggle('on', mineV);
    b.classList.toggle('has', !mineV && c > 0);
    b.title = mineV ? 'You vouched for this — click to take it back' : 'I hear the term in this track';
    const vc = b.querySelector('.vc'); if (vc) vc.textContent = c || '';
    const item = b.closest('.evitem'); if (item) item.classList.toggle('supported', c > 0);
  });
  document.querySelectorAll('[data-sup]').forEach(el => {
    const c = LEX.find(x => x.id === el.dataset.sup); if (!c) return;
    el.innerHTML = supportLine(c);
    el.classList.toggle('some', support(c).backed > 0);
  });
  const cav = document.getElementById('caveat');   // a vote landing anywhere changes this count
  if (cav) cav.innerHTML = caveatLine();
  document.querySelectorAll('[data-cmeta]').forEach(el => {      // the collapsed bar says it too
    const c = LEX.find(x => x.id === el.dataset.cmeta); if (!c) return;
    const s = support(c);
    el.innerHTML = `${s.total} example${s.total === 1 ? '' : 's'}`
      + (s.backed ? ` &middot; <b>${s.backed} vouched</b>` : '');
  });
  reorderEvidence();
}

/* Keep best-supported first as votes land, without a full re-render. Moving existing
   nodes leaves the card's height unchanged, so the reader's scroll position survives —
   which matters most in the case this is for: voting while listening, part-way down a page. */
function reorderEvidence() {
  document.querySelectorAll('[data-list]').forEach(list => {
    const cardId = list.dataset.list;
    const items = [...list.children];
    const cnt = el => voteCount(cardId, el.dataset.ev.split('|')[1]);
    const rank = el => SRC_RANK[el.dataset.src] || 0;      // curated first on a tie
    const sorted = items.slice().sort((a, b) =>
      (cnt(b) - cnt(a)) || (rank(a) - rank(b)) || (+a.dataset.idx - +b.dataset.idx));
    if (sorted.some((el, i) => el !== items[i])) sorted.forEach(el => list.appendChild(el));
  });
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-like]');
  if (!b) return;
  const id = b.dataset.like, on = mine.has(id);
  on ? mine.delete(id) : mine.add(id);
  saveLikes(mine);
  const w = window.__bumpLike && window.__bumpLike(likeId(id), on ? -1 : 1);
  if (w && w.catch) w.catch(() => {});   // local-first: a refused heart simply does not stick
  renderCounts();
});

/* ---------- the prompt pop-out ----------
   Highlights every occurrence of the recorded span. Escaping happens first, then the
   escaped span is wrapped, so a span containing markup characters can never inject. */
function hl(text, span) {
  const e = esc(text), s = esc(span);
  if (!s) return e;
  /* Each highlight carries its own literal so it can be copied on its own — the phrase
     is usually what you actually want to paste into a prompt you are writing, and it is
     more fiddly to select by hand inside a wrapped block than the whole prompt is. */
  const tag = `<mark data-span="${encodeURIComponent(span)}" role="button" tabindex="0"`
    + ` aria-label="Copy this phrase">${s}</mark>`;   // aria-label, not title: a native
                                                       // tooltip would fire alongside the
                                                       // badge and cover more of the prompt

  return e.split(s).join(tag);
}
function openPrompt(cardId, idx, src) {
  const c = LEX.find(x => x.id === cardId); if (!c) return;
  let e, v;
  if (src === 'add') {
    /* An attached track is addressed by Suno id, and only has a prompt to show if it came
       out of this library in the first place. The span is worked out on the spot — nobody
       recorded one, because nobody curated it. */
    v = bySuno.get(String(idx)); if (!v) return;
    e = { n: v.n ?? v.id, span: literalIn(`${v.style || ''}\n${v.neg || ''}`, stemsOf(c)) };
  } else {
    e = (src === 'more' ? c._more : c.ev)[idx]; if (!e) return;
    v = byN.get(String(e.n)); if (!v) return;
  }
  const neg = `${v.neg || ''}${v.neg ? ', ' : ''}${MANDATED}`;
  document.getElementById('mtitle').innerHTML =
    `${esc(c.term)} <span class="evn">— ${src === 'more' ? 'uses this wording' : src === 'add' ? 'attached by a listener' : 'evidence'}`
    + ` from #${esc(e.n)} ${esc(v.name || '')}</span>`;
  document.getElementById('mbody').innerHTML =
    `<p class="mnote">The highlighted words are the exact span this lesson is about, shown where
       they actually appear — <b>click a highlight to copy just that phrase</b>. Copy at the
       right gives you the whole prompt, plain, with no highlighting.</p>
     <div class="plab"><span>Positive prompt</span>
       <button class="btn" type="button" data-copy="${encodeURIComponent(v.style || '')}">Copy</button></div>
     <pre>${hl(v.style || '', e.span)}</pre>
     <div class="plab"><span>Negative + 8 mandated</span>
       <button class="btn" type="button" data-copy="${encodeURIComponent(neg)}">Copy</button></div>
     <pre class="neg">${hl(neg, e.span)}</pre>`;
  document.getElementById('ov').classList.add('on');
}
function closePrompt() { document.getElementById('ov').classList.remove('on'); }

document.addEventListener('click', e => {
  const p = e.target.closest('[data-prompt]');
  if (p) { const [id, i, src] = p.dataset.prompt.split('|'); openPrompt(id, src === 'add' ? i : +i, src); return; }
  if (e.target.id === 'mclose' || e.target.id === 'ov') closePrompt();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePrompt(); });

/* copy — yields plain text, never the highlight markup */
function copyText(txt) {
  if (navigator.clipboard && navigator.clipboard.writeText)
    return navigator.clipboard.writeText(txt).catch(() => { fallback(txt); });
  fallback(txt);
  return Promise.resolve();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  const txt = decodeURIComponent(b.dataset.copy);
  copyText(txt).then(() => {
    const t = b.textContent;
    b.textContent = 'Copied'; b.classList.add('done');
    setTimeout(() => { b.textContent = t; b.classList.remove('done'); }, 1200);
  });
});

/* Same copy, different confirmation: a highlight must NOT swap its own text for the word
   "Copied" the way the buttons do — that would rewrite the prompt in front of the reader.
   The badge is a ::after, so the quoted phrase stays exactly as it appears in the prompt. */
function copySpan(m) {
  copyText(decodeURIComponent(m.dataset.span)).then(() => {
    m.classList.add('copied');
    clearTimeout(m._t);
    m._t = setTimeout(() => m.classList.remove('copied'), 1300);
  });
}
document.addEventListener('click', e => {
  const m = e.target.closest('mark[data-span]'); if (m) copySpan(m);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const m = document.activeElement;
  if (m && m.matches && m.matches('mark[data-span]')) { e.preventDefault(); copySpan(m); }
});
function fallback(txt) {
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------- side player (the audio is hotlink-protected, so this is the embed) ----------
   The playing demo is marked on its own tile so you can see what the player is holding
   without scrolling to find it. Tracked as a uuid rather than a node, because the cards
   are rebuilt on every render — a class set on an element would vanish on the next search
   keystroke. The same demo can be attached to more than one lesson, and every instance
   lights up, which is a small bonus: it shows where else that take is being used. */
let nowPlaying = null;
function markPlaying() {
  document.querySelectorAll('.tile').forEach(t =>
    t.classList.toggle('playing', !!nowPlaying && t.dataset.uuid === nowPlaying));
}

/* The player's heart carries the same class and data attributes as a card heart, so the
   existing click handler and renderCounts() drive it with no special cases — hearting it
   here updates the card too, because they are the same id. It is bound to the LESSON the
   playing demo belongs to, since that is what the hearts on this page count. */
function bindPlayerHeart(cardId) {
  const wrap = document.getElementById('plikewrap'), b = document.getElementById('plike'),
        cnt = document.getElementById('plikecount');
  if (!cardId) { wrap.hidden = true; b.dataset.like = ''; cnt.dataset.lc = ''; return; }
  b.dataset.like = cardId; cnt.dataset.lc = cardId; wrap.hidden = false;
  renderCounts();
}
document.addEventListener('click', e => {
  const t = e.target.closest('.tile'); if (!t) return;
  const card = t.closest('.card');
  nowPlaying = t.dataset.uuid;
  markPlaying();
  document.getElementById('ptitle').textContent = t.dataset.title || '';
  document.getElementById('pframe').src = 'https://suno.com/embed/' + t.dataset.uuid;
  bindPlayerHeart(card && card.dataset.id);
  document.getElementById('player').classList.remove('collapsed');
});
document.getElementById('ptab').addEventListener('click', () =>
  document.getElementById('player').classList.toggle('collapsed'));

/* ---------- attaching a track ----------
   The toggle is patched in place rather than re-rendered: opening a form should not rebuild
   99 cards, and a rebuild would take the focus straight back out of the input. */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-addtoggle]');
  if (!t) return;
  const id = t.dataset.addtoggle, open = !addOpen.has(id);
  open ? addOpen.add(id) : addOpen.delete(id);
  if (!open) { addDraft.delete(id); addMsg.delete(id); }
  t.innerHTML = open ? '&times; Never mind' : '+ I know a better example';
  const form = t.parentElement.querySelector('.addform');
  if (!form) return;
  form.classList.toggle('open', open);
  const box = form.querySelector('.addin');
  if (open && box) box.focus();
  else if (box) box.value = '';
});
document.addEventListener('click', e => {
  const g = e.target.closest('[data-addgo]');
  if (g) attachTrack(g.dataset.addgo);
});
document.addEventListener('input', e => {
  const box = e.target.closest && e.target.closest('[data-addin]');
  if (box) addDraft.set(box.dataset.addin, box.value);
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const box = e.target.closest && e.target.closest('[data-addin]');
  if (box) { e.preventDefault(); attachTrack(box.dataset.addin); }
});

/* ---------- controls ----------
   Touching any other control drops the pick. A lens that survived the filter under it would
   leave the toolbar lying — every other pill would look broken, because the one card on
   screen would not answer to any of them. */
const clearPick = () => { curPick = null; };
document.getElementById('q').addEventListener('input', () => { clearPick(); render(); });
document.getElementById('needs').addEventListener('click', e => {
  clearPick();
  curNeeds = !curNeeds; e.target.classList.toggle('on', curNeeds); render();
});

/* ---------- one lesson, at random ----------
   149 cards is a library, not a lesson — and the honest state of a reader arriving is that
   they do not know which one they need. This picks for them, out of the ones they have not
   marked learned, and leans on a rule that was already here: a list of exactly one opens
   itself, so the lesson arrives read-to-read rather than as a heading to click.

   The current pick is excluded from the draw, so a second click always moves. When it is the
   last one left the click does nothing rather than pretending to reshuffle. */
document.getElementById('frandom').addEventListener('click', () => {
  const pool = pickable(searchWords()).filter(c => c.id !== curPick);
  if (!pool.length) return;
  curPick = pool[Math.floor(Math.random() * pool.length)].id;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});
/* ---------- vouching for a demo ----------
   The mechanics moved into castVote, which attaching a track uses too — one optimistic
   write, one rollback, whichever end of the page it was triggered from. */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-vote]'); if (!b) return;
  const [cardId, n] = b.dataset.vote.split('|');
  castVote(cardId, n);
});

/* Marking a lesson learned re-renders, because it can change what the active filter
   should be showing — mark the card you are reading while "Unlearned" is on and it
   should leave the list. Scroll is preserved so the page does not jump. */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-learn]'); if (!b) return;
  const id = b.dataset.learn;
  learned.has(id) ? learned.delete(id) : learned.add(id);
  saveLearned();
  const y = window.scrollY;
  render();
  window.scrollTo(0, y);
});

/* The two are mutually exclusive; clicking the active one clears it. */
function setLearnFilter(which) {
  clearPick();
  curLearn = (curLearn === which) ? null : which;
  document.getElementById('flearned').classList.toggle('on', curLearn === 'learned');
  document.getElementById('funlearned').classList.toggle('on', curLearn === 'unlearned');
  render();
}
document.getElementById('flearned').addEventListener('click', () => setLearnFilter('learned'));
document.getElementById('funlearned').addEventListener('click', () => setLearnFilter('unlearned'));

/* An era chip is a shortcut into the search box rather than a filter of its own — the
   toolbar already carries three filters and a fourth rail would cost more than it returns. */
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip.era'); if (!chip) return;
  const q = document.getElementById('q');
  q.value = chip.dataset.era;
  q.dispatchEvent(new Event('input'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.getElementById('rail').addEventListener('click', e => {
  /* Difficulty toggles, domains replace. The two behave differently on purpose: there is
     one domain a term belongs to at a time and a whole band of difficulties worth seeing
     together, so a second click on a lit tier removes it rather than swapping to it. */
  const h = e.target.closest('[data-hear]');
  if (h) {
    clearPick();
    const lvl = +h.dataset.hear;
    setHear(curHear.has(lvl) ? [...curHear].filter(x => x !== lvl) : [...curHear, lvl]);
    return;
  }
  const b = e.target.closest('[data-dom]'); if (!b) return;
  clearPick();
  curDomain = b.dataset.dom || null;
  document.querySelectorAll('[data-dom]').forEach(x => x.classList.toggle('on', x === b));
  render();
});

/* The chip on a card is a lens rather than a toggle: someone clicking "3/4 Hard to hear"
   on a card is asking to see that tier, not to add it to whatever was already selected. */
document.addEventListener('click', e => {
  const chip = e.target.closest('.chip.diff'); if (!chip) return;
  clearPick();
  const lvl = +chip.dataset.hear;
  setHear(curHear.size === 1 && curHear.has(lvl) ? [] : [lvl]);
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

/* The two shortcuts span the scale where the rail cannot in one click. Each is a straight
   set-or-clear, so pressing the lit one gets you back to everything. */
const bandPill = (id, band) => document.getElementById(id).addEventListener('click', () => {
  clearPick();
  const on = band.length === curHear.size && band.every(h => curHear.has(h));
  setHear(on ? [] : band);
});
bandPill('feasy', [1, 2]);
bandPill('fhard', [3, 4]);

/* ---------- opening and closing a lesson ----------
   Toggled in place rather than re-rendered: flipping one class is instant and leaves the
   reader exactly where they were, while rebuilding ninety-nine cards to change one of them
   would move the page under whoever just clicked. */
const cardOpen = new Set();

function setOpen(id, open) {
  open ? cardOpen.add(id) : cardOpen.delete(id);
  const card = document.getElementById(id);
  if (!card) return;
  card.classList.toggle('open', open);
  const head = card.querySelector('.chead');
  if (head) {
    head.setAttribute('aria-expanded', open ? 'true' : 'false');
    head.title = open ? 'Collapse this lesson' : 'Open this lesson';
  }
  markPlaying();          // tiles that were hidden are now real again
}

document.addEventListener('click', e => {
  const head = e.target.closest('.chead');
  if (!head) return;
  /* The bar carries its own controls — the permalink, Mark learned, the era chips. A click
     that landed on one of those was meant for it, not for the card. */
  if (e.target.closest('a, button, [data-era], [data-hear]')) return;
  const id = head.dataset.card;
  setOpen(id, !cardOpen.has(id));
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const head = document.activeElement;
  if (!head || !head.matches || !head.matches('.chead')) return;
  e.preventDefault();
  setOpen(head.dataset.card, !cardOpen.has(head.dataset.card));
});

/* Open or close everything at once. The label reads as what the button will DO, and which
   one that is depends on what is currently on screen rather than on a remembered mode —
   filter down to four cards, open them, and the button offers to close those four. */
function visibleCards() { return [...document.querySelectorAll('.card')]; }
document.getElementById('expandall').addEventListener('click', e => {
  const cards = visibleCards();
  const opening = cards.some(el => !cardOpen.has(el.dataset.id));
  cards.forEach(el => setOpen(el.dataset.id, opening));
  syncExpandAll();
});
function syncExpandAll() {
  const btn = document.getElementById('expandall');
  const cards = visibleCards();
  const opening = cards.some(el => !cardOpen.has(el.dataset.id));
  btn.textContent = opening ? 'Open all' : 'Close all';
  btn.classList.toggle('on', !opening && cards.length > 0);
}

/* ---------- deep links (§9: a stable fragment per card) ---------- */
function jumpToHash() {
  const id = decodeURIComponent(location.hash.slice(1)); if (!id) return;
  /* A pick hides every other card, so a permalink into one of them would find nothing in the
     DOM and quietly do nothing at all. Being sent to a named lesson outranks the lens. */
  if (curPick && curPick !== id && LEX.some(c => c.id === id)) { clearPick(); render(); }
  const el = document.getElementById(id); if (!el) return;
  setOpen(id, true);                     // somebody followed a link to this lesson to read it
  syncExpandAll();
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
window.addEventListener('hashchange', jumpToHash);

buildRail();
/* Painted once here so the note is right before Firebase answers — and again on every vote,
   so it is right afterwards too. It cannot be painted up with the masthead counts: reading a
   vote needs `added`, which is not initialised that early, and the whole script dies there.
   If the backend never answers this reads zero heard, which is the truthful thing to tell a
   reader who cannot see anybody else's votes. */
document.getElementById('caveat').innerHTML = caveatLine();
render();
jumpToHash();
</script>

<script type="module">

   Keys here are prefixed "lex:" so the two pages cannot collide (design doc §9).
   If the SDK cannot load, the page keeps working with local-only hearts. */

import { getDatabase, ref, onValue, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  measurementId:"G-T33BH0E51P"
};
try{
  const db=getDatabase(initializeApp(firebaseConfig));
  onValue(ref(db,'likes'),snap=>{
    window.__likeCounts=snap.val()||{};
    window.__renderCounts&&window.__renderCounts();
  });
  window.__bumpLike=(id,delta)=>runTransaction(ref(db,'likes/'+id),cur=>{
    const v=(cur||0)+delta; return v<0?undefined:v;
  }).catch(e=>{ console.warn('[likes] write failed',e); throw e; });   // rethrow: callers roll back

  /* Support votes need no wiring of their own: they are counters in the same `likes`
     map, keyed `lexev:<cardId>:<entry>`, so the listener and writer above already
     carry them. That is the reason for reusing the path rather than adding one — the
     rule allowing exactly ±1 per write is what keeps a vote count honest.

     A track a listener attaches rides the same path for the same reason, keyed
     `lexadd:<cardId>:<suno id>`. Putting the id in the KEY is what avoids a second
     table and a second rule: the value stays a counter that moves by one, so the
     existing rule covers a kind of row it was never written for. */
}catch(e){ console.warn('[likes] Firebase disabled, local-only hearts:',e); }
</script>
