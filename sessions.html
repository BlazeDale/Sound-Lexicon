<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sessions · Sound Lexicon</title>
<meta name="description" content="Every working sitting — what was made, how much of it was kept, and how much is still unheard.">
<style>
  :root{
    --ink:#111419; --panel:#181c24; --panel2:#1f2530; --line:#2a313d;
    --text:#e9e6dd; --muted:#98a0ad; --dim:#6b7280;
    --amber:#e0a63c; --amber-dim:#8a6a2a; --teal:#1a9e75; --rose:#d03b3b; --violet:#8a7fe0;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ink);color:var(--text);
       font:15px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:26px 16px 80px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--amber);margin:0 0 8px}
  .eyebrow a{color:var(--amber);text-decoration:none;border-bottom:1px dotted var(--amber-dim)}
  .eyebrow a:hover{border-bottom-style:solid}
  h1{margin:0 0 6px;font-size:27px;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 24px;max-width:70ch}

  .card{display:block;text-decoration:none;color:inherit;background:var(--panel);
        border:1px solid var(--line);border-left:3px solid var(--amber-dim);border-radius:12px;
        padding:18px 20px 16px;margin:0 0 14px;transition:border-color .15s,background .15s,transform .15s}
  .card:hover{border-color:var(--amber);border-left-color:var(--amber);background:var(--panel2);transform:translateY(-2px)}
  .chead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
  .cdate{font-family:var(--mono);font-size:11.5px;color:var(--amber);flex:none}
  .ctitle{font-weight:600;font-size:17px}
  .cnote{color:var(--muted);font-size:13.5px;margin:7px 0 0;max-width:76ch}

  /* ---------- the counts ----------
     Kept leads because it is the only number here that says anything about quality rather than
     volume, and it is the one that decides what the next round gets built on. */
  .stats{display:flex;flex-wrap:wrap;gap:0 18px;margin:13px 0 0;padding-top:11px;
         border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim)}
  .stats b{color:var(--text);font-weight:600}
  .stats .kept b{color:var(--amber)}
  .stats .unheard b{color:var(--violet)}
  .go{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
      color:var(--amber);margin-top:10px;display:block}
  .empty{color:var(--dim);font-size:13.5px;padding:26px 2px}

  .new{border:1px dashed var(--line);border-radius:12px;padding:16px 18px;margin:22px 0 0}
  .nhead{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
         color:var(--dim);margin:0 0 11px}
  .new input,.new textarea{width:100%;background:var(--ink);color:var(--text);border:1px solid var(--line);
        border-radius:7px;padding:9px 11px;font:inherit;font-size:13.5px;margin:0 0 8px}
  .new textarea{min-height:56px;resize:vertical}
  .new input:focus,.new textarea:focus{outline:none;border-color:var(--amber-dim)}
  .nrow{display:flex;align-items:center;gap:11px}
  .new button{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;
        color:var(--amber);background:none;border:1px solid var(--amber-dim);border-radius:7px;
        padding:7px 15px;cursor:pointer}
  .new button:hover{background:rgba(224,166,60,.08)}
  .nstat{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .draft{border-left-color:var(--teal)}
  .draft .cdate{color:var(--teal)}
  .pend{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--teal);border:1px solid var(--teal);border-radius:5px;padding:2px 7px;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow"><a href="index.html">Sound Lexicon</a> / Sessions</p>
  <h1>Sessions</h1>
  <p class="sub">
    Every working sitting, newest first. A session is a sequence of corrections — each round
    carries the note saying why it differs from the one before — so the count that matters is
    how much came out of it worth keeping.
  </p>

  <div id="list"><p class="empty">Loading…</p></div>

  <!-- ---------- starting one ----------
       A sitting usually begins with a track to work off, so the form asks for exactly that: a
       name and the Suno link that is its BASE. The page cannot reach suno.com to read the clip,
       and cannot write to the repo, so this records the intent — title, date, base — and the
       log is filled in from it when the session is actually built. -->
  <div class="new">
    <p class="nhead">Start a session</p>
    <input id="n-title" type="text" maxlength="120" placeholder="What is this sitting about?">
    <input id="n-base" type="text" maxlength="200" placeholder="Suno link for the BASE track (optional)">
    <textarea id="n-note" maxlength="800" placeholder="What you are trying to get at (optional)"></textarea>
    <div class="nrow">
      <button id="n-go">Create</button>
      <span class="nstat" id="n-stat"></span>
    </div>
  </div>
</div>

<script>
/* The log is fetched rather than <script src>'d, for the reason the session page learned the
   hard way: a page and its data cache independently, and a stale log here would quietly
   misreport every count on the page with nothing to show that it had. */
const DB_ROOT = 'https://vocal-timbre-library-default-rtdb.firebaseio.com';
const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
const takesOf = s => [s.id, ...(s.alt ? [s.alt] : [])];

async function load() {
  const r = await fetch('sessions_data.js', { cache: 'reload' });
  return (new Function(await r.text() + '; return SESSIONS;'))();
}

/* One place a keep lives: likes/<clipId>, set by the ★ on a take. Queue hearts and Suno likes
   were folded into it, so there is nothing else to consult and nothing to add up. */
async function keptSet(sessions) {
  const kept = new Set();
  const ids = [...new Set(sessions.flatMap(s => s.runs.flatMap(r => r.songs.flatMap(takesOf))))];
  await Promise.all(ids.map(async id => {
    try {
      const r = await fetch(`${DB_ROOT}/likes/${encodeURIComponent(id)}.json`);
      if (r.ok && await r.json()) kept.add(id);
    } catch (e) {}
  }));
  return kept;
}

const played = (() => {
  try { return new Set(JSON.parse(localStorage.getItem('sl.session.played.v1') || '[]')); }
  catch (e) { return new Set(); }
})();

function render(sessions, kept) {
  const list = document.getElementById('list');
  list.textContent = '';
  if (!sessions.length) { list.append(el('p', 'empty', 'No sessions logged yet.')); return; }

  sessions.forEach(ses => {
    const songs = ses.runs.flatMap(r => r.songs);
    const takes = songs.flatMap(takesOf);
    const keptCount = songs.filter(s => takesOf(s).some(t => kept.has(t))).length;
    /* Unheard means neither Suno nor this browser has ever played it — Suno's own count is in
       the log, swept from the library. */
    const sunoPlayed = new Set();
    songs.forEach(s => takesOf(s).forEach((cid, i) => { if ((s.plays || [])[i] > 0) sunoPlayed.add(cid); }));
    const unheard = takes.filter(t => !played.has(t) && !sunoPlayed.has(t)).length;
    const secs = songs.reduce((a, s) => a + (s.dur || 0), 0);

    const card = el('a', 'card');
    card.href = 'session.html?id=' + encodeURIComponent(ses.id);

    const head = el('div', 'chead');
    head.append(el('span', 'cdate', ses.date));
    head.append(el('span', 'ctitle', ses.title));
    card.append(head);
    if (ses.note) card.append(el('p', 'cnote', ses.note));

    const stats = el('div', 'stats');
    const stat = (cls, n, label) => {
      const sp = el('span', cls);
      sp.append(el('b', null, String(n)), document.createTextNode(' ' + label));
      return sp;
    };
    stats.append(stat('', ses.runs.length, ses.runs.length === 1 ? 'round' : 'rounds'));
    stats.append(stat('', songs.length, 'songs'));
    stats.append(stat('', takes.length, 'takes'));
    stats.append(stat('kept', keptCount, 'kept ★'));
    if (unheard) stats.append(stat('unheard', unheard, 'unplayed'));
    stats.append(stat('', Math.round(secs / 60), 'min'));
    card.append(stats);
    card.append(el('span', 'go', 'Open this session →'));
    list.append(card);
  });
}

/* ---------- drafts ----------
   A session started here exists in the database before it exists in the log. It is shown with
   the real ones, marked pending, so an intention does not vanish between opening it and the
   work actually happening. */
async function loadDrafts() {
  try {
    const r = await fetch(`${DB_ROOT}/session_drafts.json`);
    if (!r.ok) return [];
    const d = await r.json() || {};
    return Object.entries(d).map(([id, v]) => ({ id, ...v }))
      .sort((a, b) => (b.created || 0) - (a.created || 0));
  } catch (e) { return []; }
}

function renderDrafts(drafts, logged) {
  const have = new Set(logged.map(s => s.id));
  const list = document.getElementById('list');
  drafts.filter(d => !have.has(d.id)).forEach(d => {
    const card = el('div', 'card draft');
    const head = el('div', 'chead');
    head.append(el('span', 'cdate', d.date || ''));
    head.append(el('span', 'ctitle', d.title || 'Untitled session'));
    head.append(el('span', 'pend', 'not started'));
    card.append(head);
    if (d.note) card.append(el('p', 'cnote', d.note));
    if (d.baseUrl) {
      const a = el('a', 'cnote');
      a.href = d.baseUrl; a.target = '_blank'; a.rel = 'noopener';
      a.style.color = 'var(--teal)';
      a.textContent = 'BASE · ' + d.baseUrl;
      card.append(a);
    }
    list.prepend(card);
  });
}

document.getElementById('n-go').addEventListener('click', async () => {
  const title = document.getElementById('n-title').value.trim();
  const stat = document.getElementById('n-stat');
  if (!title) { stat.textContent = 'give it a name first'; return; }
  const baseUrl = document.getElementById('n-base').value.trim();
  const m = baseUrl.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/);
  const today = new Date().toISOString().slice(0, 10);
  const id = today + '-' + title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40);
  const body = { title, date: today, created: Date.now() };
  const note = document.getElementById('n-note').value.trim();
  if (note) body.note = note;
  if (baseUrl) body.baseUrl = baseUrl;
  if (m) body.baseId = m[1];
  stat.textContent = 'creating…';
  try {
    const r = await fetch(`${DB_ROOT}/session_drafts/${encodeURIComponent(id)}.json`,
      { method: 'PUT', body: JSON.stringify(body) });
    if (!r.ok) throw new Error(String(r.status));
    stat.textContent = 'created — it will fill in as the work happens';
    document.getElementById('n-title').value = '';
    document.getElementById('n-base').value = '';
    document.getElementById('n-note').value = '';
    const [sessions, drafts] = await Promise.all([load(), loadDrafts()]);
    render(sessions, new Set());
    renderDrafts(drafts, sessions);
    keptSet(sessions).then(k => { render(sessions, k); renderDrafts(drafts, sessions); });
  } catch (e) {
    stat.textContent = 'could not save — the database rules may not be published yet';
  }
});

(async () => {
  let sessions;
  try { sessions = await load(); }
  catch (e) {
    const list = document.getElementById('list');
    list.textContent = '';
    list.append(el('p', 'empty', 'Could not load the session log.'));
    return;
  }
  render(sessions, new Set());                 // the counts that need no network, immediately
  const drafts = await loadDrafts();
  renderDrafts(drafts, sessions);
  keptSet(sessions).then(kept => { render(sessions, kept); renderDrafts(drafts, sessions); });
})();
</script>
</body>
</html>
